deck: Comparisons
source: Spring and Spring Boot/README.md
tag: compare
# Short front/back pairs, so they are also generated reversed (Quarkus/MP -> Spring).
defaults: { reverse: true }
# Each labelled card gets a task line such as "Equivalent in MicroProfile?" (and "Equivalent in Spring?" when reversed).
auto_prompt: true

sections:
  - section: Configuration
    cards:
      - id: cmp-value
        q: |-
          **Spring:** `@Value("${appraisal.goblin-commission}")`
        a: |-
          **MicroProfile:** `@ConfigProperty(name = "appraisal.goblin-commission")`
        extra: |-
          The default value syntax differs: `${key:default}` in Spring, vs the `defaultValue = "..."` attribute in MicroProfile.
      - id: cmp-configuration-properties
        q: |-
          **Spring:** `@ConfigurationProperties(prefix = "appraisal")`
        a: |-
          **Quarkus:** `@ConfigMapping(prefix = "appraisal")` (MicroProfile: `@ConfigProperties`)
      - id: cmp-profiles
        q: |-
          **Spring:** `application-dev.properties` + `spring.profiles.active=dev`
        a: |-
          **Quarkus:** a `%dev.` prefix in `application.properties` + `quarkus.profile=dev`
        extra: |-
          `application-dev.properties` also works in Quarkus. Spring `@Profile` ≈ Quarkus `@IfBuildProfile` (decided at build time).
      - id: cmp-config-server
        q: |-
          **Spring:** Spring Cloud Config Server
        a: |-
          **MicroProfile/Quarkus:** no config server. A pluggable `ConfigSource`, in practice Kubernetes ConfigMaps/Secrets (ordinal 270)
        extra: |-
          Quarkus can also read from a Spring Config Server with `quarkus-spring-cloud-config-client`.
      - id: cmp-refreshscope
        q: |-
          **Spring:** `@RefreshScope` + `POST /actuator/refresh`
        a: |-
          **MicroProfile:** no equivalent. Inject `Provider<T>` or `ConfigValue` to re-read the value on each access
        reverse: false

  - section: Calling other services
    cards:
      - id: cmp-feign
        q: |-
          **Spring:** Feign client (`@FeignClient` interface)
        a: |-
          **MicroProfile:** REST Client (`@RegisterRestClient` interface)
        extra: |-
          Both are annotated interfaces with a generated implementation. Feign uses **Spring MVC** annotations; the MicroProfile REST Client uses **JAX-RS** annotations. Spring 6 also has `@HttpExchange`.
      - id: cmp-webclient
        q: |-
          **Spring:** `WebClient` (reactive HTTP client)
        a: |-
          **Quarkus:** Vert.x Web Client (Mutiny API)
      - id: cmp-reactor-mutiny
        q: |-
          **Reactor:** `Mono<T>` / `Flux<T>`
        a: |-
          **Mutiny:** `Uni<T>` / `Multi<T>`
      - id: cmp-discovery
        q: |-
          **Spring Cloud:** Eureka + `lb://service-id` / `@LoadBalanced`
        a: |-
          **Quarkus:** Kubernetes Service DNS, or SmallRye **Stork** (`quarkus.rest-client.x.url=stork://service-id`)
      - id: cmp-client-interceptor
        q: |-
          **Spring:** `ClientHttpRequestInterceptor` (on `RestTemplate`)
        a: |-
          **JAX-RS / MicroProfile REST Client:** `ClientRequestFilter`
      - id: cmp-token-propagation
        q: |-
          **Spring:** propagating the caller's token with an OAuth2-aware `WebClient`/`RestClient` (or the legacy `KeycloakRestTemplate`)
        a: |-
          **MicroProfile REST Client:** `@RegisterClientHeaders` + `org.eclipse.microprofile.rest.client.propagateHeaders=Authorization`
        reverse: false

  - section: Gateway
    cards:
      - id: cmp-gateway
        q: |-
          **Spring:** Spring Cloud Gateway
        a: |-
          **MicroProfile/Quarkus:** no gateway component. Use a Kubernetes Ingress / Gateway API, a service mesh (Istio), or Kong/Envoy
        reverse: false

  - section: Fault tolerance
    cards:
      - id: cmp-ft-config-location
        q: |-
          Fault tolerance: where do the **parameters** live? Resilience4j vs MicroProfile FT
        a: |-
          **Resilience4j:** the annotation names an instance; all parameters go in YAML.
          **MicroProfile:** the parameters are annotation attributes, overridable in config (`Class/method/Retry/maxRetries=5`).
        reverse: false
      - id: cmp-fallback-signature
        q: |-
          What signature must a fallback method have: Resilience4j vs MicroProfile `@Fallback`?
        a: |-
          **Resilience4j:** the original parameters **+ `Throwable`**.
          **MicroProfile:** **exactly** the original parameters.
        reverse: false
      - id: cmp-ratelimiter
        q: |-
          **Resilience4j:** `@RateLimiter`
        a: |-
          **MicroProfile FT:** none. SmallRye Fault Tolerance adds `@RateLimit`
      - id: cmp-timelimiter
        q: |-
          **Resilience4j:** `@TimeLimiter`
        a: |-
          **MicroProfile FT:** `@Timeout`
        extra: |-
          Resilience4j's time limiter only applies to asynchronous (`CompletableFuture`) methods.
      - id: cmp-circuitbreaker
        q: |-
          **Resilience4j:** `@CircuitBreaker(name = ...)` + `slidingWindowSize`, `failureRateThreshold`, `waitDurationInOpenState`
        a: |-
          **MicroProfile:** `@CircuitBreaker(requestVolumeThreshold, failureRatio, delay)`

  - section: Messaging
    cards:
      - id: cmp-binder-connector
        q: |-
          **Spring Cloud Stream:** binder / binding
        a: |-
          **MP Reactive Messaging:** connector / channel
      - id: cmp-consumer-incoming
        q: |-
          **Spring Cloud Stream:** a `@Bean Consumer<T>`
        a: |-
          **MP Reactive Messaging:** an `@Incoming` method
      - id: cmp-supplier-outgoing
        q: |-
          **Spring Cloud Stream:** a `@Bean Supplier<T>`
        a: |-
          **MP Reactive Messaging:** an `@Outgoing` method
      - id: cmp-function-processor
        q: |-
          **Spring Cloud Stream:** a `@Bean Function<T, R>`
        a: |-
          **MP Reactive Messaging:** a method with both `@Incoming` and `@Outgoing`
      - id: cmp-streambridge-emitter
        q: |-
          **Spring Cloud Stream:** `StreamBridge.send(binding, payload)`
        a: |-
          **MP Reactive Messaging:** `Emitter.send(payload)` (`@Inject @Channel(...) Emitter<T>`)
      - id: cmp-destination-topic
        q: |-
          **Spring:** `spring.cloud.stream.bindings.<binding>.destination=knight-sightings`
        a: |-
          **MicroProfile:** `mp.messaging.incoming.<channel>.topic=knight-sightings`
      - id: cmp-consumer-group
        q: |-
          **Spring Cloud Stream:** a consumer `group`
        a: |-
          **Kafka / MP Reactive Messaging:** the Kafka `group.id`

  - section: Observability
    cards:
      - id: cmp-health
        q: |-
          **Spring Boot Actuator:** `HealthIndicator`
        a: |-
          **MicroProfile Health:** `HealthCheck` (with `@Liveness` / `@Readiness` / `@Startup`)
      - id: cmp-health-paths
        q: |-
          **Spring:** `/actuator/health/liveness`, `/actuator/health/readiness`
        a: |-
          **Quarkus:** `/q/health/live`, `/q/health/ready`
      - id: cmp-metrics
        q: |-
          **Spring Boot:** Micrometer `MeterRegistry`
        a: |-
          **Quarkus:** the **same library**, Micrometer (`quarkus-micrometer`). The older alternative is MP Metrics
      - id: cmp-tracing
        q: |-
          **Spring Boot 3:** Micrometer Tracing (formerly Sleuth)
        a: |-
          **Quarkus:** OpenTelemetry (formerly MP OpenTracing)

  - section: Security
    cards:
      - id: cmp-jwt-config
        q: |-
          **Spring:** `spring.security.oauth2.resourceserver.jwt.issuer-uri`
        a: |-
          **MP JWT:** `mp.jwt.verify.issuer` + `mp.jwt.verify.publickey.location`
      - id: cmp-jwt-roles
        q: |-
          Where do roles come from in a JWT: Spring resource server vs MP JWT?
        a: |-
          **MP JWT:** the `groups` claim (Keycloak needs a mapper).
          **Spring:** by default the `scope` claim becomes `SCOPE_xxx` authorities. Keycloak realm roles (`realm_access.roles`) need a custom `JwtAuthenticationConverter`.
        reverse: false
      - id: cmp-ssl
        q: |-
          **Spring Boot:** `server.ssl.key-store=classpath:dragonbank.p12`
        a: |-
          **Quarkus:** `quarkus.http.ssl.certificate.key-store-file=dragonbank.p12`

  - section: Testing
    cards:
      - id: cmp-mock-bean
        q: |-
          **Spring Boot test:** `@MockitoBean` (formerly `@MockBean`)
        a: |-
          **Quarkus test:** `@InjectMock`
      - id: cmp-testcontainers
        q: |-
          **Spring Boot:** Testcontainers + `@ServiceConnection`
        a: |-
          **Quarkus:** Dev Services (automatic), or a `QuarkusTestResourceLifecycleManager`

  - section: Dependency injection
    source: Spring and Spring Boot/Spring core and Spring Boot.md
    cards:
      - id: cmp-component
        q: |-
          **Spring:** `@Component` / `@Service`
        a: |-
          **CDI:** a bean with a bean-defining annotation, e.g. `@ApplicationScoped`
      - id: cmp-bean-produces
        q: |-
          **Spring:** a `@Bean` method in a `@Configuration` class
        a: |-
          **CDI:** a `@Produces` method
      - id: cmp-autowired-inject
        q: |-
          **Spring:** `@Autowired`
        a: |-
          **CDI:** `@Inject`
        extra: |-
          Spring also accepts `@Inject`.
      - id: cmp-qualifier
        q: |-
          Qualifiers: how do Spring and CDI differ?
        a: |-
          **Spring:** `@Qualifier("fireproof")` is **string-based** (custom qualifier annotations work too).
          **CDI:** qualifiers are **type-safe annotations** (`@Qualifier` on your own annotation).
        reverse: false
      - id: cmp-primary
        q: |-
          **Spring:** `@Primary`
        a: |-
          **CDI:** `@Alternative` + `@Priority` (Quarkus also has `@DefaultBean`)
      - id: cmp-singleton-eager
        q: |-
          A Spring singleton vs a CDI `@ApplicationScoped` bean: when created, and what is injected?
        a: |-
          **Spring:** created **eagerly** at startup (unless `@Lazy`), injected **directly**.
          **CDI:** created **lazily**, injected through a **client proxy**.
        reverse: false
      - id: cmp-prototype
        q: |-
          **Spring:** `@Scope("prototype")`
        a: |-
          **CDI:** `@Dependent` (the CDI default)
      - id: cmp-app-class
        q: |-
          Spring Boot's application class and classpath scanning: what is the Quarkus counterpart?
        a: |-
          None: beans are discovered **at build time** from the Jandex index, and extensions do the "auto-configuration" at build time. Excluding an auto-configuration = not adding the extension.
        reverse: false
      - id: cmp-profile-annotation
        q: |-
          **Spring:** `@Profile("dev")` on a bean
        a: |-
          **Quarkus:** `@IfBuildProfile("dev")` (decided at build time), or `@LookupIfProperty`
      - id: cmp-devtools
        q: |-
          **Spring Boot:** `spring-boot-devtools`
        a: |-
          **Quarkus:** `mvn quarkus:dev`

  - section: AOP and interceptors
    source: Spring and Spring Boot/Spring AOP.md
    cards:
      - id: cmp-aspect-interceptor
        q: |-
          **Spring:** an `@Aspect` with `@Around` advice
        a: |-
          **CDI:** an `@Interceptor` with an `@AroundInvoke` method
      - id: cmp-proceedingjoinpoint
        q: |-
          **Spring AOP:** `ProceedingJoinPoint.proceed()`
        a: |-
          **CDI:** `InvocationContext.proceed()`
      - id: cmp-pointcut-vs-binding
        q: |-
          How does a Spring aspect select its methods, vs a CDI interceptor?
        a: |-
          **Spring:** a **pointcut expression** (package, name pattern, annotation), so the target code can stay unaware of it.
          **CDI:** only where you put the **interceptor binding** annotation (or `@Interceptors`).
        reverse: false

  - section: Persistence and transactions
    source: Spring and Spring Boot/Spring Data JPA.md
    cards:
      - id: cmp-spring-data-panache
        q: |-
          **Spring Data JPA:** an **interface** extending `JpaRepository`, with derived queries from method names
        a: |-
          **Quarkus Panache:** a **class** implementing `PanacheRepository`; finders written with short queries like `find("dragonName", name)`
      - id: cmp-active-record
        q: |-
          Which persistence style does Panache offer that Spring Data doesn't?
        a: |-
          **Active record**: `Hoard extends PanacheEntity`, `Hoard.find(...)`.
        reverse: false
      - id: cmp-jakarta-data
        q: |-
          **Spring:** Spring Data repositories
        a: |-
          **Jakarta EE 11:** Jakarta Data (`@Repository` interfaces, `CrudRepository`, derived queries, `@Find`/`@Query`)
      - id: cmp-data-rest
        q: |-
          **Spring:** Spring Data REST
        a: |-
          **Quarkus:** REST Data with Panache
      - id: cmp-ddl-auto
        q: |-
          **Spring:** `spring.jpa.hibernate.ddl-auto` / `spring.jpa.show-sql`
        a: |-
          **Quarkus:** `quarkus.hibernate-orm.database.generation` / `quarkus.hibernate-orm.log.sql`
      - id: cmp-datasource-pool
        q: |-
          **Spring Boot:** `spring.datasource.*`, HikariCP pool
        a: |-
          **Quarkus:** `quarkus.datasource.*`, Agroal pool
      - id: cmp-rollbackfor
        q: |-
          **Spring `@Transactional`:** `rollbackFor` / `noRollbackFor`
        a: |-
          **JTA `@Transactional`:** `rollbackOn` / `dontRollbackOn`
      - id: cmp-nested
        q: |-
          Which transaction propagation exists only in Spring?
        a: |-
          `NESTED` (a savepoint inside the current transaction).
        reverse: false
      - id: cmp-transactiontemplate
        q: |-
          **Spring:** `transactionTemplate.execute(status -> ...)`
        a: |-
          **Quarkus:** `QuarkusTransaction.requiringNew().run(...)` (JTA: `UserTransaction`)
      - id: cmp-test-transaction
        q: |-
          **Spring test:** `@Transactional` on a test method (rolled back)
        a: |-
          **Quarkus test:** `@TestTransaction`

  - section: REST
    source: Spring and Spring Boot/REST with Spring Boot.md
    cards:
      - id: cmp-requestmapping-path
        q: |-
          **Spring:** `@RestController` + `@RequestMapping("/appraisals")`
        a: |-
          **JAX-RS:** `@Path("/appraisals")` on the class
      - id: cmp-getmapping
        q: |-
          **Spring:** `@GetMapping("/{id}")`
        a: |-
          **JAX-RS:** `@GET` + `@Path("{id}")`
      - id: cmp-requestparam
        q: |-
          **Spring:** `@RequestParam`
        a: |-
          **JAX-RS:** `@QueryParam` or `@FormParam`
        extra: |-
          Spring parameters are **required by default**; a missing JAX-RS parameter is just `null` (or its `@DefaultValue`).
      - id: cmp-pathvariable
        q: |-
          **Spring:** `@PathVariable`
        a: |-
          **JAX-RS:** `@PathParam`
      - id: cmp-requestheader
        q: |-
          **Spring:** `@RequestHeader`
        a: |-
          **JAX-RS:** `@HeaderParam`
      - id: cmp-requestbody
        q: |-
          **Spring:** a `@RequestBody` parameter
        a: |-
          **JAX-RS:** an unannotated entity parameter
      - id: cmp-produces
        q: |-
          **Spring:** `produces` / `consumes` attributes of `@GetMapping`
        a: |-
          **JAX-RS:** `@Produces` / `@Consumes` annotations
      - id: cmp-responseentity
        q: |-
          **Spring:** `ResponseEntity<T>`
        a: |-
          **JAX-RS:** `Response`
      - id: cmp-exceptionhandler
        q: |-
          **Spring:** `@RestControllerAdvice` + `@ExceptionHandler`
        a: |-
          **JAX-RS:** an `ExceptionMapper` (Quarkus: `@ServerExceptionMapper`)
      - id: cmp-hateoas
        q: |-
          **Spring HATEOAS:** `linkTo(methodOn(...))`
        a: |-
          **JAX-RS:** only basic `Link` support (`Response.links(...)`, `Link.fromUri(...)`)
        reverse: false
      - id: cmp-json
        q: |-
          **Spring:** Jackson
        a: |-
          **Jakarta EE:** JSON-B (Quarkus: either)
      - id: cmp-valid-validated
        q: |-
          Method validation on a bean: what does Spring need that CDI/Quarkus doesn't?
        a: |-
          **Spring:** `@Validated` on the class (AOP proxy; no self-invocation).
          **CDI / Quarkus:** works out of the box.
        reverse: false
      - id: cmp-validation-exception
        q: |-
          **Spring:** an invalid `@Valid @RequestBody` → `MethodArgumentNotValidException` → 400
        a: |-
          **JAX-RS:** an invalid `@Valid` parameter → `ConstraintViolationException` → 400

  - section: Web UI
    source: Spring and Spring Boot/Spring MVC.md
    cards:
      - id: cmp-mvc-jsf
        q: |-
          **Spring:** Spring MVC (controllers returning a view name)
        a: |-
          **Jakarta EE:** JSF (component-based, backing beans), or the action-based Jakarta MVC
      - id: cmp-thymeleaf-qute
        q: |-
          **Spring:** Thymeleaf
        a: |-
          **Quarkus:** Qute (`{expression}` syntax, type-safe at build time)

  - section: Security (Spring)
    source: Spring and Spring Boot/Spring Security/Spring Boot Security.md
    cards:
      - id: cmp-userdetailsservice
        q: |-
          **Spring Security:** `UserDetailsService` / `AuthenticationProvider`
        a: |-
          **Jakarta Security:** an identity store (`IdentityStore`)
      - id: cmp-httpbasic
        q: |-
          **Spring Security:** `httpBasic()` / `formLogin()`
        a: |-
          **Jakarta Security:** `@BasicAuthenticationMechanismDefinition` / `@FormAuthenticationMechanismDefinition`
      - id: cmp-filterchain-quarkus
        q: |-
          **Spring Security:** URL rules in a `SecurityFilterChain` bean
        a: |-
          **Quarkus:** properties `quarkus.http.auth.permission.<name>.paths=/api/*` + `.policy=authenticated`
      - id: cmp-rolesallowed
        q: |-
          `@RolesAllowed`: what does Spring need that Jakarta EE and Quarkus don't?
        a: |-
          `@EnableMethodSecurity(jsr250Enabled = true)`. In Jakarta EE and Quarkus it works out of the box.
        reverse: false
      - id: cmp-preauthorize
        q: |-
          **Spring Security:** `@PreAuthorize` (SpEL)
        a: |-
          **Quarkus:** `@PermissionsAllowed` (no standard Jakarta equivalent)
      - id: cmp-security-jpa
        q: |-
          **Spring Security:** a custom `UserDetailsService` loading users with JPA
        a: |-
          **Quarkus:** `quarkus-security-jpa`: annotate the entity with `@UserDefinition`, `@Username`, `@Password`, `@Roles`; no service to write

  - section: Testing (Spring)
    source: Spring and Spring Boot/Testing Spring applications.md
    cards:
      - id: cmp-springboottest
        q: |-
          **Spring:** `@SpringBootTest` (context cached between test classes)
        a: |-
          **Quarkus:** `@QuarkusTest` (the app is started **once** for all tests)
      - id: cmp-mockmvc
        q: |-
          **Spring:** MockMvc
        a: |-
          **Quarkus:** none; tests call the app over HTTP with REST Assured
        reverse: false
      - id: cmp-slices
        q: |-
          **Spring:** slice tests and different contexts (`@WebMvcTest`, `@DataJpaTest`, `@ActiveProfiles`)
        a: |-
          **Quarkus:** no slices; a different setup is a `@TestProfile`, which restarts the app
        reverse: false
